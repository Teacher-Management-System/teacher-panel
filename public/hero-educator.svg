<svg width="680" height="560" viewBox="0 0 680 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="680" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7FAFB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2BD4DB"/>
      <stop offset="1" stop-color="#149BA1"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F2530"/>
      <stop offset="1" stop-color="#123A42"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1FC0C7"/>
      <stop offset="1" stop-color="#0E7C82"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E7C82" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background blob -->
  <path d="M340 22C470 12 618 60 648 176c30 116-22 214-58 286-36 72-148 84-250 74S94 508 52 420C10 332 22 216 88 132 154 48 210 32 340 22Z" fill="url(#bgGrad)"/>

  <!-- Circuit traces -->
  <g stroke="#1FC0C7" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M60 300h60l24-24h40"/>
    <path d="M60 340h44l30 30h52"/>
    <path d="M560 120h40l20 20v40"/>
    <path d="M596 420h-40l-24 24h-48"/>
  </g>
  <g fill="#1FC0C7">
    <circle cx="60" cy="300" r="5" fill-opacity="0.8"/>
    <circle cx="184" cy="276" r="5" fill-opacity="0.5"/>
    <circle cx="186" cy="370" r="5" fill-opacity="0.5"/>
    <circle cx="620" cy="180" r="5" fill-opacity="0.7"/>
    <circle cx="484" cy="444" r="5" fill-opacity="0.6"/>
    <circle cx="60" cy="340" r="5" fill-opacity="0.4"/>
  </g>

  <!-- Dots grid -->
  <g fill="#0E7C82" fill-opacity="0.14">
    <circle cx="90" cy="90" r="3"/><circle cx="110" cy="90" r="3"/><circle cx="130" cy="90" r="3"/>
    <circle cx="90" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="130" cy="110" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="110" cy="130" r="3"/><circle cx="130" cy="130" r="3"/>
    <circle cx="560" cy="480" r="3"/><circle cx="580" cy="480" r="3"/><circle cx="600" cy="480" r="3"/>
    <circle cx="560" cy="500" r="3"/><circle cx="580" cy="500" r="3"/><circle cx="600" cy="500" r="3"/>
  </g>

  <!-- Chalkboard -->
  <g filter="url(#softShadow)">
    <rect x="96" y="128" width="300" height="220" rx="20" fill="url(#boardGrad)" stroke="#1FC0C7" stroke-opacity="0.5" stroke-width="3"/>
  </g>
  <!-- Board stand -->
  <rect x="230" y="348" width="14" height="80" rx="7" fill="#134E52"/>
  <rect x="186" y="424" width="102" height="14" rx="7" fill="#134E52"/>

  <!-- Board content -->
  <text x="126" y="180" font-family="ui-monospace, monospace" font-size="26" font-weight="700" fill="#3EE6EC">&lt;AI /&gt;</text>
  <text x="126" y="212" font-family="ui-monospace, monospace" font-size="15" fill="#9BE8EB" opacity="0.85">robot.teach()</text>

  <!-- Mini circuit on board -->
  <g stroke="#3EE6EC" stroke-width="2" fill="none" opacity="0.9">
    <path d="M136 250h40l16 16h36"/>
    <path d="M136 286h28l20-20"/>
  </g>
  <circle cx="228" cy="266" r="4.5" fill="#3EE6EC"/>
  <circle cx="136" cy="250" r="4.5" fill="#3EE6EC"/>
  <circle cx="184" cy="266" r="4.5" fill="#FBBF24"/>
  <rect x="240" y="240" width="26" height="18" rx="4" fill="none" stroke="#3EE6EC" stroke-width="2"/>

  <!-- Bar chart on board -->
  <g fill="#1FC0C7">
    <rect x="300" y="288" width="16" height="34" rx="4" fill-opacity="0.5"/>
    <rect x="324" y="268" width="16" height="54" rx="4" fill-opacity="0.75"/>
    <rect x="348" y="244" width="16" height="78" rx="4"/>
  </g>
  <path d="M300 250l24-18 22 8 22-26" stroke="#FBBF24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="368" cy="214" r="4" fill="#FBBF24"/>

  <!-- Robot -->
  <g filter="url(#softShadow)">
    <!-- antenna -->
    <line x1="500" y1="164" x2="500" y2="196" stroke="#0E7C82" stroke-width="6" stroke-linecap="round"/>
    <circle cx="500" cy="156" r="12" fill="#FBBF24"/>
    <circle cx="500" cy="156" r="5" fill="#FFF7E0"/>
    <!-- head -->
    <rect x="440" y="196" width="120" height="96" rx="28" fill="url(#tealGrad)"/>
    <rect x="456" y="216" width="88" height="56" rx="18" fill="#0F2530"/>
    <!-- eyes -->
    <circle cx="484" cy="244" r="11" fill="#3EE6EC"/>
    <circle cx="516" cy="244" r="11" fill="#3EE6EC"/>
    <circle cx="487" cy="241" r="4" fill="#EFFFFF"/>
    <circle cx="519" cy="241" r="4" fill="#EFFFFF"/>
    <!-- smile -->
    <path d="M488 262c4 6 20 6 24 0" stroke="#3EE6EC" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- ears -->
    <rect x="428" y="228" width="14" height="32" rx="7" fill="#0E7C82"/>
    <rect x="558" y="228" width="14" height="32" rx="7" fill="#0E7C82"/>
    <!-- neck -->
    <rect x="488" y="292" width="24" height="16" rx="6" fill="#0E7C82"/>
    <!-- body -->
    <rect x="432" y="308" width="136" height="110" rx="26" fill="url(#tealGrad)"/>
    <rect x="456" y="330" width="88" height="52" rx="14" fill="#0F2530"/>
    <text x="470" y="362" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#3EE6EC">01&#10084;</text>
    <circle cx="500" cy="400" r="7" fill="#0F2530" opacity="0.35"/>
    <!-- left arm holding pointer -->
    <path d="M436 330c-24 4-40 0-52-18" stroke="#0E7C82" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="382" cy="310" r="12" fill="#149BA1"/>
    <line x1="382" y1="310" x2="352" y2="252" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
    <!-- right arm waving -->
    <path d="M566 330c26-8 38-26 40-48" stroke="#0E7C82" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="608" cy="278" r="13" fill="#149BA1"/>
    <!-- legs -->
    <rect x="454" y="418" width="20" height="34" rx="10" fill="#0E7C82"/>
    <rect x="526" y="418" width="20" height="34" rx="10" fill="#0E7C82"/>
    <rect x="442" y="448" width="44" height="16" rx="8" fill="#134E52"/>
    <rect x="514" y="448" width="44" height="16" rx="8" fill="#134E52"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="500" cy="482" rx="110" ry="14" fill="#0E7C82" fill-opacity="0.12"/>
  <ellipse cx="238" cy="452" rx="90" ry="12" fill="#0E7C82" fill-opacity="0.10"/>

  <!-- Floating badge: graduation cap -->
  <g filter="url(#cardShadow)">
    <circle cx="130" cy="420" r="34" fill="#FFFFFF"/>
    <path d="M130 404l-26 12 26 12 26-12-26-12Z" fill="url(#capGrad)"/>
    <path d="M114 422v10c0 5 8 9 16 9s16-4 16-9v-10" stroke="#0E7C82" stroke-width="3" fill="none"/>
    <line x1="156" y1="416" x2="156" y2="434" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating badge: lightbulb -->
  <g filter="url(#cardShadow)">
    <circle cx="580" cy="90" r="30" fill="#FFFFFF"/>
    <path d="M580 72c-9 0-16 7-16 16 0 6 3 10 7 14v6h18v-6c4-4 7-8 7-14 0-9-7-16-16-16Z" fill="#FBBF24"/>
    <rect x="573" y="108" width="14" height="6" rx="3" fill="#0E7C82"/>
  </g>

  <!-- Floating badge: gear -->
  <g filter="url(#cardShadow)">
    <circle cx="86" cy="220" r="28" fill="#FFFFFF"/>
    <g fill="#149BA1">
      <circle cx="86" cy="220" r="13" fill="none" stroke="#149BA1" stroke-width="5"/>
      <rect x="83" y="198" width="6" height="9" rx="2"/>
      <rect x="83" y="233" width="6" height="9" rx="2"/>
      <rect x="60" y="217" width="9" height="6" rx="2"/>
      <rect x="103" y="217" width="9" height="6" rx="2"/>
      <rect x="66" y="200" width="7" height="7" rx="2" transform="rotate(45 69 203)"/>
      <rect x="100" y="234" width="7" height="7" rx="2" transform="rotate(45 103 237)"/>
    </g>
  </g>

  <!-- Floating chip card -->
  <g filter="url(#cardShadow)">
    <rect x="330" y="60" width="120" height="64" rx="16" fill="#FFFFFF"/>
    <rect x="346" y="76" width="32" height="32" rx="8" fill="url(#tealGrad)"/>
    <g stroke="#0E7C82" stroke-width="3" stroke-linecap="round">
      <line x1="352" y1="70" x2="352" y2="76"/><line x1="362" y1="70" x2="362" y2="76"/><line x1="372" y1="70" x2="372" y2="76"/>
      <line x1="352" y1="108" x2="352" y2="114"/><line x1="362" y1="108" x2="362" y2="114"/><line x1="372" y1="108" x2="372" y2="114"/>
    </g>
    <rect x="390" y="80" width="46" height="7" rx="3.5" fill="#1FC0C7" fill-opacity="0.8"/>
    <rect x="390" y="94" width="32" height="7" rx="3.5" fill="#CBD5E1"/>
  </g>

  <!-- Orbit ring -->
  <ellipse cx="360" cy="300" rx="290" ry="230" stroke="#1FC0C7" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 10" fill="none"/>
  <circle cx="360" cy="70" r="7" fill="#1FC0C7"/>
  <circle cx="646" cy="330" r="6" fill="#FBBF24"/>
</svg>
