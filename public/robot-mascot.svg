<svg width="360" height="380" viewBox="0 0 360 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mTeal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2BD4DB"/>
      <stop offset="1" stop-color="#149BA1"/>
    </linearGradient>
    <filter id="mShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E7C82" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- glow ring -->
  <circle cx="180" cy="190" r="150" fill="#1FC0C7" fill-opacity="0.08"/>
  <circle cx="180" cy="190" r="150" stroke="#1FC0C7" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3 9" fill="none"/>

  <g filter="url(#mShadow)">
    <!-- antenna -->
    <line x1="180" y1="52" x2="180" y2="84" stroke="#0E7C82" stroke-width="6" stroke-linecap="round"/>
    <circle cx="180" cy="44" r="11" fill="#FBBF24"/>
    <!-- head -->
    <rect x="112" y="84" width="136" height="104" rx="30" fill="url(#mTeal)"/>
    <rect x="130" y="106" width="100" height="60" rx="20" fill="#0F2530"/>
    <circle cx="162" cy="136" r="12" fill="#3EE6EC"/>
    <circle cx="198" cy="136" r="12" fill="#3EE6EC"/>
    <circle cx="165" cy="132" r="4.5" fill="#EFFFFF"/>
    <circle cx="201" cy="132" r="4.5" fill="#EFFFFF"/>
    <path d="M168 154c4 7 20 7 24 0" stroke="#3EE6EC" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="98" y="118" width="14" height="36" rx="7" fill="#0E7C82"/>
    <rect x="248" y="118" width="14" height="36" rx="7" fill="#0E7C82"/>
    <!-- neck + body -->
    <rect x="166" y="188" width="28" height="16" rx="7" fill="#0E7C82"/>
    <rect x="106" y="204" width="148" height="112" rx="28" fill="url(#mTeal)"/>
    <circle cx="180" cy="252" r="26" fill="#0F2530"/>
    <path d="M180 238l4.5 9.5 10.5 1.5-7.6 7.4 1.8 10.6-9.2-5-9.2 5 1.8-10.6-7.6-7.4 10.5-1.5 4.5-9.5Z" fill="#FBBF24"/>
    <circle cx="140" cy="296" r="6" fill="#0F2530" opacity="0.35"/>
    <circle cx="220" cy="296" r="6" fill="#0F2530" opacity="0.35"/>
    <!-- waving arm -->
    <path d="M252 224c26-10 36-30 36-54" stroke="#0E7C82" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="290" cy="164" r="14" fill="#149BA1"/>
    <!-- other arm -->
    <path d="M108 232c-22 6-34 20-38 40" stroke="#0E7C82" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="68" cy="276" r="13" fill="#149BA1"/>
    <!-- legs -->
    <rect x="134" y="316" width="20" height="30" rx="10" fill="#0E7C82"/>
    <rect x="206" y="316" width="20" height="30" rx="10" fill="#0E7C82"/>
    <rect x="122" y="342" width="44" height="16" rx="8" fill="#134E52"/>
    <rect x="194" y="342" width="44" height="16" rx="8" fill="#134E52"/>
  </g>
  <ellipse cx="180" cy="368" rx="96" ry="10" fill="#0E7C82" fill-opacity="0.14"/>
</svg>
